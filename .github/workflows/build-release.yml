name: Build & Sign Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history + a token that can push back so the
          # post-build commit (version bump on main) works.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-bump the patch version of the app on every push to
      # main, BEFORE the APK is built, so:
      #   - the APK that lands as a GitHub Release already carries
      #     the new version,
      #   - the next PR opened against main starts from a baseline
      #     that's never accidentally the same as the last release.
      # Does not run on PRs / workflow_dispatch — only on real
      # pushes to main. The commit back at the end of the job uses
      # [skip ci] so this workflow does not re-trigger itself.
      - name: Bump patch version
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x scripts/bump-patch.sh
          scripts/bump-patch.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > /tmp/sclite.jks

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PSCLITE_KEYSTORE=/tmp/sclite.jks \
            -PSCLITE_STOREPASS="${{ secrets.KEYSTORE_PASS }}" \
            -PSCLITE_KEYALIAS="${{ secrets.KEY_ALIAS }}" \
            -PSCLITE_KEYPASS="${{ secrets.KEY_PASS }}"

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/sclite.jks

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          NEW_NAME="OpenSound-v${VERSION}-release.apk"
          cp "$APK" "app/build/outputs/apk/release/$NEW_NAME"
          echo "APK_FINAL=app/build/outputs/apk/release/$NEW_NAME" >> $GITHUB_ENV
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_FINAL }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "OpenSound build #${{ github.run_number }}"
          body: |
            Automated release from commit ${{ github.sha }}
          files: ${{ env.APK_FINAL }}
          draft: false
          prerelease: false

      # Commit the bumped versionName / versionCode back to main so
      # the repo state reflects the version we just built. The commit
      # message contains [skip ci] which tells GitHub Actions to NOT
      # run any workflows on this push, so we don't end up in a
      # bump -> build -> bump loop.
      - name: Commit version bump back to main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bump.outputs.new_version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if git diff --staged --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git push origin HEAD:main
          fi
